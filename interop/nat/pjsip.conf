; Asterisk for the NAT lab: listens on the "internet" side and has all of Asterisk's own NAT workarounds
; disabled (no rport forcing, no contact rewriting, no symmetric RTP). Calls to and from a phone behind the NAT
; therefore only work if the phone itself advertises reachable addresses (STUN) and keeps the NAT binding open.

[global]
type=global
user_agent=Asterisk-nat-lab

[transport-udp]
type=transport
protocol=udp
bind=203.0.113.2:5160

[endpoint-template](!)
type=endpoint
context=softphone-tests
disallow=all
allow=ulaw,alaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=no
force_rport=no
rewrite_contact=no

[auth-template](!)
type=auth
auth_type=userpass

[aor-template](!)
type=aor
max_contacts=1
remove_existing=yes
minimum_expiration=60
default_expiration=300

[alice](endpoint-template)
auth=alice-auth
aors=alice
[alice-auth](auth-template)
username=alice
password=alice-secret
[alice](aor-template)

[bob](endpoint-template)
auth=bob-auth
aors=bob
[bob-auth](auth-template)
username=bob
password=bob-secret
[bob](aor-template)
