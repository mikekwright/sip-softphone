; Asterisk PJSIP configuration for softphone-lib interop testing.
; Two users (alice, bob) with digest authentication, UDP and TCP transports on port 5160.

[global]
type=global
user_agent=Asterisk-interop

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5160

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5160

[endpoint-template](!)
type=endpoint
context=softphone-tests
disallow=all
allow=ulaw,alaw,vp8,h264
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
max_audio_streams=1
max_video_streams=1

[auth-template](!)
type=auth
auth_type=userpass

[aor-template](!)
type=aor
max_contacts=5
remove_existing=yes
minimum_expiration=60
default_expiration=300

[alice](endpoint-template)
auth=alice-auth
aors=alice
[alice-auth](auth-template)
username=alice
password=alice-secret
[alice](aor-template)

[bob](endpoint-template)
auth=bob-auth
aors=bob
[bob-auth](auth-template)
username=bob
password=bob-secret
[bob](aor-template)
