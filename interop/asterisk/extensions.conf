; Dial plan for interop tests.
;   600  echo test (answer, echo media back)
;   601  DTMF capture: reads up to 4 digits ending with #, writes them to /tmp/asterisk-dtmf.txt, says goodbye
;   602  plays a 1 kHz tone for 10 s (audio path check)
;   alice / bob  calls the registered user through Asterisk (B2BUA)
[softphone-tests]
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => 601,1,Answer()
 same => n,Read(DIGITS,beep,4,,1,10)
 same => n,System(echo ${DIGITS} > /tmp/asterisk-dtmf.txt)
 same => n,Wait(1)
 same => n,Hangup()

exten => 602,1,Answer()
 same => n,Playtones(1000)
 same => n,Wait(10)
 same => n,Hangup()

exten => alice,1,Dial(PJSIP/alice,20)
exten => bob,1,Dial(PJSIP/bob,20)
